<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header class="main-header">

        <div class="logo">
            <a href="index.html">ATLAS</a>
        </div>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="#">Categories</a>
            <a href="#">Products</a>
        </nav>

        <div class="header-actions">

            <a href="wishlist.html" class="nav-icon">
                ❤️ Wishlist
                <span id="wishlist-count">0</span>
            </a>

            <a href="cart.html" class="nav-icon">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>

            <a href="login.html" class="nav-icon">
                👤 Login
            </a>

        </div>

    </header>

    <!-- Checkout -->

    <main class="checkout-page">

        <h1>Checkout</h1>

        <div class="checkout-container">

            <!-- Left Side -->

            <div class="checkout-left">

                <!-- Address -->

                <section class="checkout-card">

                    <h2>Delivery Address</h2>

                    <p>No address selected.</p>

                    <button class="primary-btn" id="add-address">
                        + Add New Address
                    </button>

                </section>

                <!-- Order Items -->

                <section class="checkout-card">

                    <h2>Order Summary</h2>

                    <div id="checkout-items">

                        <!-- JavaScript will load products here -->

                    </div>

                </section>

                <!-- Coupon -->

                <section class="checkout-card">

                    <h2>Coupon</h2>

                    <div class="coupon-box">

                        <input
                            type="text"
                            placeholder="Enter Coupon Code">

                        <button class="primary-btn">
                            Apply
                        </button>

                    </div>

                </section>

            </div>

            <!-- Right Side -->

            <aside class="checkout-right">

                <div class="checkout-card">

                    <h2>Price Details</h2>

                    <div class="price-row">

                        <span>Subtotal</span>

                        <span id="checkout-subtotal">
                            ₹0
                        </span>

                    </div>

                    <div class="price-row">

                        <span>Shipping</span>

                        <span style="color:green;">
                            FREE
                        </span>

                    </div>

                    <div class="price-row">

                        <span>GST</span>

                        <span>
                            Included
                        </span>

                    </div>

                    <hr>

                    <div class="price-row total">

                        <strong>Total</strong>

                        <strong id="checkout-total">
                            ₹0
                        </strong>

                    </div>

                    <button
                        class="checkout-btn"
                        id="continue-btn">

                        Continue

                    </button>

                </div>

            </aside>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
