<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas | Delivery Address</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="main-header">

    <div class="logo">
        <a href="index.html">ATLAS</a>
    </div>

    <nav class="main-nav">

        <a href="index.html">Home</a>

        <a href="#">Categories</a>

        <a href="#">Products</a>

    </nav>

    <div class="header-actions">

        <a href="wishlist.html" class="nav-icon">
            ❤️ Wishlist
            <span id="wishlist-count">0</span>
        </a>

        <a href="cart.html" class="nav-icon">
            🛒 Cart
            <span id="cart-count">0</span>
        </a>

    </div>

</header>

<main class="address-page">

    <div class="address-card">

        <h1>Delivery Address</h1>

        <p>

            Please enter your delivery details.

        </p>

        <form id="address-form">

            <input
                type="text"
                id="full-name"
                placeholder="Full Name"
                required>

            <input
                type="tel"
                id="mobile"
                placeholder="Mobile Number"
                required>

            <input
                type="text"
                id="house"
                placeholder="House / Flat No."
                required>

            <input
                type="text"
                id="street"
                placeholder="Street / Area"
                required>

            <input
                type="text"
                id="landmark"
                placeholder="Landmark (Optional)">

            <input
                type="text"
                id="city"
                placeholder="City"
                required>

            <input
                type="text"
                id="state"
                placeholder="State"
                required>

            <input
                type="text"
                id="pincode"
                placeholder="Pincode"
                required>

            <button
                class="primary-btn"
                type="submit">

                Save Address

            </button>

        </form>

    </div>

</main>

<script src="script.js"></script>

</body>

</html>
