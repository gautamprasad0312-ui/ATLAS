<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1><a href="index.html" class="logo">ATLAS</a></h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>

<main class="cart-page">

    <h2>Shopping Cart</h2>

    <div id="cart-items">

        <!-- Products will appear here automatically -->

    </div>

    <div class="cart-summary">

        <h3>Order Summary</h3>

        <p>Total Items:
            <span id="total-items">0</span>
        </p>

        <p>Total Price:
            <strong id="total-price">₹0</strong>
        </p>

        <button id="checkout-btn">
            Proceed to Checkout
        </button>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
